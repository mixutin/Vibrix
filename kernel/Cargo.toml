[package]
name = "vibrix-kernel"
version = "0.0.1"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true

[features]
default = []
qemu-debugcon = []
panic-probe = []
breakpoint-probe = []
page-fault-probe = []
vm-write-probe = []
vm-unmap-probe = []
managed-write-probe = []
managed-unmap-probe = []
managed-guard-probe = []
managed-nx-probe = []
pci-irq-probe = ["qemu-debugcon"]
pci-msix-probe = ["qemu-debugcon"]
preempt-thread-probe = ["qemu-debugcon"]
ring3-probe = ["qemu-debugcon"]
address-space-probe = ["qemu-debugcon"]
elf-load-probe = ["qemu-debugcon", "address-space-probe"]
syscall-probe = ["qemu-debugcon", "address-space-probe"]
process-syscall-probe = ["qemu-debugcon", "address-space-probe"]
xhci-init-probe = ["qemu-debugcon"]

[dependencies]
vibrix-vmm = { path = "../shared/vmm", version = "=0.0.1" }
