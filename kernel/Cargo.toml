[package]
name = "vibrix-kernel"
version = "0.0.1"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true

[features]
default = []
qemu-debugcon = []
panic-probe = []
breakpoint-probe = []
page-fault-probe = []
vm-write-probe = []
vm-unmap-probe = []
managed-write-probe = []
managed-unmap-probe = []
managed-guard-probe = []
managed-nx-probe = []
pci-irq-probe = ["qemu-debugcon"]
pci-msix-probe = ["qemu-debugcon"]
preempt-thread-probe = ["qemu-debugcon"]
ring3-probe = ["qemu-debugcon"]
address-space-probe = ["qemu-debugcon"]
user-stack-guard-probe = ["qemu-debugcon", "address-space-probe"]
elf-load-probe = ["qemu-debugcon", "address-space-probe"]
syscall-probe = ["qemu-debugcon", "address-space-probe"]
process-syscall-probe = ["qemu-debugcon", "address-space-probe"]
userspace-io-probe = ["qemu-debugcon", "address-space-probe", "process-syscall-probe"]
rust-shell-probe = ["qemu-debugcon", "address-space-probe", "process-syscall-probe", "elf-load-probe", "userspace-io-probe"]
# Reuse the verified single-BSP ELF/TTY path; add the guest framebuffer frontend.
userspace-shell = ["rust-shell-probe"]
userspace-desktop = ["rust-shell-probe"]
core-utils-probe = ["rust-shell-probe"]
xhci-init-probe = ["qemu-debugcon"]
usb-enum-probe = ["qemu-debugcon"]
usb-hub-probe = ["qemu-debugcon"]
usb-hid-keyboard-probe = ["qemu-debugcon"]
usb-hid-mouse-probe = ["qemu-debugcon"]
rust-init-probe = ["qemu-debugcon", "address-space-probe", "process-syscall-probe", "elf-load-probe"]

[dependencies]
vibrix-vmm = { path = "../shared/vmm", version = "=0.0.1" }
