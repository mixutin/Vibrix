name: Hardware compatibility evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  hardware-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test compatibility and quirk policy
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib device::
          cargo clippy --locked -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Exercise native post-firmware compatibility report
        run: |
          ./tools/test-qemu.sh
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel hardware compatibility report ready'
          tr -d '\r' < build/qemu/serial.log | grep -E '^Vibrix hardware compatibility: discovered=[1-9][0-9]* driver_candidates=[0-9]+ missing_driver=[0-9]+ known_limitations=[0-9]+$'
