name: Editor core evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  editor-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --target x86_64-unknown-none
      - name: Test and compile editor core
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-editor
          cargo clippy --locked -p vibrix-editor --target x86_64-unknown-none -- -D warnings
          cargo check --locked -p vibrix-editor --target x86_64-unknown-none
