name: Developer mode separation evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  developer-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - name: Validate feature boundary and scripts
        run: |
          cargo fmt --all -- --check
          bash -n tools/run-qemu.sh tools/build-qemu.sh tools/test-qemu.sh
          cargo clippy --locked -p vibrix-kernel --all-features --target x86_64-unknown-none -- -D warnings
          grep -Fq 'verbose-boot = ["developer-mode"]' kernel/Cargo.toml
          grep -Fq 'panic-probe = ["developer-mode"]' kernel/Cargo.toml
          grep -Fq 'managed-write-probe = ["developer-mode"]' kernel/Cargo.toml
      - name: Prove standard mode boot
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq 'VIBRIX: operational mode standard' build/qemu/debugcon.log
          ! grep -Fq 'VIBRIX: operational mode developer' build/qemu/debugcon.log
      - name: Prove explicit developer mode boot
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,developer-mode,verbose-boot bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq 'VIBRIX: operational mode developer' build/qemu/debugcon.log
          grep -Fq 'VIBRIX: verbose boot bootinfo reported' build/qemu/debugcon.log
