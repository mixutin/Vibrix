name: GUI toolkit evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gui-toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --target x86_64-unknown-none
      - name: Test and lint reusable UI plus desktop integration
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-ui --lib
          cargo test --locked -p vibrix-desktop --lib
          cargo clippy --locked -p vibrix-ui --target x86_64-unknown-none -- -D warnings
          cargo clippy --locked -p vibrix-desktop --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Exercise toolkit through real userspace desktop framebuffer
        run: python3 tools/test_desktop_display.py
