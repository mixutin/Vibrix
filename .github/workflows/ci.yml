name: Vibrix CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    name: Dependency supply-chain gate
    uses: ./.github/workflows/dependencies.yml

  repository-quality:
    name: Workflow and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dependency-policy helpers and enforce action pins
        run: |
          python3 -m unittest discover -s tools -p 'test_dependency_inventory.py' -v
          python3 tools/dependency_inventory.py --workflows .github/workflows
          git ls-files --error-unmatch Cargo.lock
      - name: Install pinned workflow linter
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflow syntax and expressions
        run: '"$RUNNER_TEMP/bin/actionlint" -shellcheck="" -pyflakes=""'
      - name: Check website JavaScript syntax
        run: node --check site/script.js

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject newly introduced known vulnerabilities in every scope
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false

  minimal-features:
    name: Minimal features (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vibrix-boot
            target: x86_64-unknown-uefi
          - package: vibrix-kernel
            target: x86_64-unknown-none
          - package: vibrix-vmm
            target: x86_64-unknown-none
          - package: vibrix-syscall
            target: x86_64-unknown-none
          - package: vibrix-init
            target: x86_64-unknown-none
          - package: vibrix-shell
            target: x86_64-unknown-none
          - package: vibrix-desktop
            target: x86_64-unknown-none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - name: Check actual target without default features
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: cargo check --locked --package "$PACKAGE" --no-default-features --target "$TARGET"

  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check development script modes and syntax
        run: |
          for script in tools/*.sh; do
            mode="$(git ls-files --stage -- "$script" | cut -d ' ' -f 1)"
            if [[ "$mode" != "100755" ]]; then
              echo "::error file=$script::Expected tracked executable mode 100755, got ${mode:-untracked}"
              exit 1
            fi
            bash -n "$script"
          done
      - name: Test host OVMF firmware discovery
        run: |
          bash -n tools/ovmf.inc
          bash -n host-tests/ovmf-discovery.sh
          bash host-tests/ovmf-discovery.sh
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install repository-pinned Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test ELF64 parser on host
        run: |
          rustc --edition=2024 --test boot/src/elf.rs -o "$RUNNER_TEMP/vibrix-elf-tests"
          "$RUNNER_TEMP/vibrix-elf-tests"
      - name: Test read-only GPT image inspector on host
        run: |
          rustfmt --check tools/inspect-gpt.rs
          rustc --edition=2024 --test tools/inspect-gpt.rs -o "$RUNNER_TEMP/vibrix-gpt-tests"
          "$RUNNER_TEMP/vibrix-gpt-tests"
          rustc --edition=2024 -D warnings tools/inspect-gpt.rs -o "$RUNNER_TEMP/vibrix-inspect-gpt"
      - name: Test shared BootInfo v3 ABI and validation on host
        run: |
          rustfmt --edition 2024 --check shared/bootinfo.rs
          rustc --edition=2024 --test shared/bootinfo.rs -o "$RUNNER_TEMP/vibrix-bootinfo-tests"
          "$RUNNER_TEMP/vibrix-bootinfo-tests"
      - name: Test Vibrix syscall ABI v1 contract on host
        run: |
          rustfmt --edition 2024 --check shared/syscall_abi.rs
          rustc --edition=2024 -D warnings --test shared/syscall_abi.rs -o "$RUNNER_TEMP/vibrix-syscall-abi-tests"
          "$RUNNER_TEMP/vibrix-syscall-abi-tests"
      - name: Test USB mass-storage BOT and SCSI wire contracts on host
        run: |
          rustfmt --edition 2024 --check shared/usb_mass_bulk.rs shared/scsi.rs
          rustc --edition=2024 -D warnings --test shared/usb_mass_bulk.rs -o "$RUNNER_TEMP/vibrix-usb-bot-tests"
          "$RUNNER_TEMP/vibrix-usb-bot-tests"
          rustc --edition=2024 -D warnings --test shared/scsi.rs -o "$RUNNER_TEMP/vibrix-scsi-tests"
          "$RUNNER_TEMP/vibrix-scsi-tests"
      - name: Test native Rust syscall wrapper policy on host
        run: |
          cargo test --locked --package vibrix-syscall
          cargo clippy --locked --package vibrix-syscall --target x86_64-unknown-none -- -D warnings
      - name: Test Rust shell parser and userspace targets
        run: |
          cargo test --locked --package vibrix-shell --lib
          cargo clippy --locked --package vibrix-init --target x86_64-unknown-none -- -D warnings
          cargo clippy --locked --package vibrix-shell --target x86_64-unknown-none -- -D warnings
      - name: Test production bootstrap VFS and stream lifetimes
        run: |
          cargo test --locked --package vibrix-kernel --lib vfs::
          cargo clippy --locked --package vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
      - name: Test argv and environment initial stack builder
        run: |
          cargo test --locked --package vibrix-kernel --lib user_stack::
      - name: Test bounded userspace ELF image loader
        run: |
          cargo test --locked --package vibrix-kernel --lib user_image::
      - name: Test process credential and DAC policy on host
        run: |
          cargo test --locked --package vibrix-kernel --lib credentials::
      - name: Test production PID/process lifecycle on host
        run: |
          cargo test --locked --package vibrix-kernel --lib process::
      - name: Test process-facing syscall wait/exit policy
        run: |
          cargo test --locked --package vibrix-kernel --lib process_syscalls::
      - name: Test safe GPT image creation and inspect both copies
        run: |
          rustfmt --edition 2024 --check tools/create-usb-image.rs
          rustc --edition=2024 --test tools/create-usb-image.rs -o "$RUNNER_TEMP/vibrix-create-image-tests"
          "$RUNNER_TEMP/vibrix-create-image-tests"
          rustc --edition=2024 -D warnings tools/create-usb-image.rs -o "$RUNNER_TEMP/vibrix-create-usb-image"
          for sector in 512 4096; do
            image="$RUNNER_TEMP/vibrix-blank-${sector}.img"
            "$RUNNER_TEMP/vibrix-create-usb-image" "$image" 64 "$sector"
            "$RUNNER_TEMP/vibrix-inspect-gpt" "$image" "$sector" | tee "$RUNNER_TEMP/vibrix-blank-${sector}.report"
            grep -Fq 'partitions=2 efi_system_partitions=1 vibrix_system_partitions=1' "$RUNNER_TEMP/vibrix-blank-${sector}.report"
            if "$RUNNER_TEMP/vibrix-create-usb-image" "$image" 64 "$sector"; then
              echo "unsafe overwrite of existing image was accepted"
              exit 1
            fi
            "$RUNNER_TEMP/vibrix-inspect-gpt" "$image" "$sector" >/dev/null
          done
      - name: Test EFI System Partition tooling on host
        run: |
          rustfmt --edition 2024 --check tools/populate-esp.rs tools/inspect-esp.rs
          rustc --edition=2024 -D warnings --test tools/populate-esp.rs -o "$RUNNER_TEMP/vibrix-populate-esp-tests"
          "$RUNNER_TEMP/vibrix-populate-esp-tests"
          rustc --edition=2024 -D warnings tools/populate-esp.rs -o "$RUNNER_TEMP/vibrix-populate-esp"
          rustc --edition=2024 -D warnings --test tools/inspect-esp.rs -o "$RUNNER_TEMP/vibrix-inspect-esp-tests"
          "$RUNNER_TEMP/vibrix-inspect-esp-tests"
          rustc --edition=2024 -D warnings tools/inspect-esp.rs -o "$RUNNER_TEMP/vibrix-inspect-esp"
          for sector in 512 4096; do
            image="$RUNNER_TEMP/vibrix-esp-${sector}.img"
            boot="$RUNNER_TEMP/fake-boot-${sector}.efi"
            kernel="$RUNNER_TEMP/fake-kernel-${sector}.elf"
            printf 'MZVibrix-UEFI-fixture' > "$boot"
            printf '\177ELFVibrix-kernel-fixture' > "$kernel"
            "$RUNNER_TEMP/vibrix-create-usb-image" "$image" 64 "$sector"
            "$RUNNER_TEMP/vibrix-populate-esp" "$image" "$boot" "$kernel" "$sector"
            "$RUNNER_TEMP/vibrix-inspect-esp" "$image" "$sector" | tee "$image.esp-report"
            grep -Fq 'Valid Vibrix ESP: /EFI/BOOT/BOOTX64.EFI=' "$image.esp-report"
            "$RUNNER_TEMP/vibrix-inspect-gpt" "$image" "$sector" >/dev/null
            if "$RUNNER_TEMP/vibrix-populate-esp" "$image" "$boot" "$kernel" "$sector"; then
              echo "unsafe overwrite of a populated ESP was accepted" >&2
              exit 1
            fi
          done

      - name: Test VibrixFS v1 wire-format conformance on host
        run: |
          rustfmt --edition 2024 --check tools/vibrixfs-wire.rs shared/vibrixfs_wire.rs
          rustc --edition=2024 -D warnings --test tools/vibrixfs-wire.rs -o "$RUNNER_TEMP/vibrixfs-wire-tests"
          "$RUNNER_TEMP/vibrixfs-wire-tests"
      - name: Test VibrixFS redo-journal wire validation on host
        run: |
          rustfmt --edition 2024 --check tools/vibrixfs-journal.rs
          rustc --edition=2024 -D warnings --test tools/vibrixfs-journal.rs -o "$RUNNER_TEMP/vibrixfs-journal-tests"
          "$RUNNER_TEMP/vibrixfs-journal-tests"
      - name: Test VibrixFS regular-file format and inspect round trip
        run: |
          rustfmt --edition 2024 --check tools/vibrixfs-image.rs
          rustc --edition=2024 -D warnings --test tools/vibrixfs-image.rs -o "$RUNNER_TEMP/vibrixfs-image-tests"
          "$RUNNER_TEMP/vibrixfs-image-tests"
          rustc --edition=2024 -D warnings tools/vibrixfs-image.rs -o "$RUNNER_TEMP/vibrixfs-image"
          FS_UUID=00112233445566778899aabbccddeeff
          ROOT_GUID=102132435465768798a9bacbdcedfe0f
          for sector in 512 4096; do
            image="$RUNNER_TEMP/vibrixfs-$sector.img"
            "$RUNNER_TEMP/vibrixfs-image" format "$image" 4096 "$sector" "$FS_UUID" "$ROOT_GUID" | tee "$image.report"
            grep -Fq "VibrixFS v1 valid: blocks=4096 logical_sector=$sector" "$image.report"
            grep -Fq "journal_blocks=66" "$image.report"
            grep -Fq "mode=0640 uid=1000 gid=1000 mtime=1700000202.234567890" "$image.report"
            "$RUNNER_TEMP/vibrixfs-image" inspect "$image" "$sector" "$ROOT_GUID" >/dev/null
            "$RUNNER_TEMP/vibrixfs-image" recover "$image" "$sector" "$ROOT_GUID" | tee "$image.recover-report"
            grep -Fq "no committed journal transaction; checkpoint generation=1" "$image.recover-report"
            "$RUNNER_TEMP/vibrixfs-image" inspect "$image" "$sector" "$ROOT_GUID" >/dev/null
            if "$RUNNER_TEMP/vibrixfs-image" format "$image" 4096 "$sector" "$FS_UUID" "$ROOT_GUID"; then
              echo "unsafe VibrixFS overwrite was accepted" >&2
              exit 1
            fi
          done
          cp "$RUNNER_TEMP/vibrixfs-512.img" "$RUNNER_TEMP/vibrixfs-corrupt.img"
          printf '\001' | dd of="$RUNNER_TEMP/vibrixfs-corrupt.img" bs=1 seek=300 conv=notrunc status=none
          if "$RUNNER_TEMP/vibrixfs-image" inspect "$RUNNER_TEMP/vibrixfs-corrupt.img" 512 "$ROOT_GUID"; then
            echo "corrupt VibrixFS metadata was accepted" >&2
            exit 1
          fi
      - name: Test UEFI memory-map acquisition on host
        run: |
          rustc --edition=2024 --test boot/src/memory_map.rs -o "$RUNNER_TEMP/vibrix-memory-map-tests"
          "$RUNNER_TEMP/vibrix-memory-map-tests"
      - name: Test loader page-release ownership on host
        run: |
          rustfmt --edition 2024 --check host-tests/loader_cleanup.rs
          rustc --edition=2024 --test host-tests/loader_cleanup.rs -o "$RUNNER_TEMP/vibrix-loader-cleanup-tests"
          "$RUNNER_TEMP/vibrix-loader-cleanup-tests"
      - name: Test production CPU transition preflight on host
        run: |
          rustfmt --edition 2024 --check boot/src/transition.rs host-tests/transition.rs
          rustc --edition=2024 --test host-tests/transition.rs -o "$RUNNER_TEMP/vibrix-transition-tests"
          "$RUNNER_TEMP/vibrix-transition-tests"
      - name: Test mapped framebuffer writes on host
        run: |
          rustfmt --edition 2024 --check kernel/src/framebuffer.rs kernel/src/debugcon.rs
          rustc --edition=2024 --test kernel/src/framebuffer.rs -o "$RUNNER_TEMP/vibrix-framebuffer-tests"
          "$RUNNER_TEMP/vibrix-framebuffer-tests"
      - name: Lint bootloader
        run: cargo clippy --locked -p vibrix-boot --features qemu-debugcon --target x86_64-unknown-uefi -- -D warnings
      - name: Test production-linked ACPI tables and MCFG parser on host
        run: |
          rustfmt --edition 2024 --check kernel/src/arch/x86_64/acpi.rs
          rustc --edition=2024 --test kernel/src/arch/x86_64/acpi.rs -o "$RUNNER_TEMP/vibrix-acpi-tests"
          "$RUNNER_TEMP/vibrix-acpi-tests"
      - name: Test production-linked early physical frame allocation on host
        run: |
          rustfmt --edition 2024 --check kernel/src/memory/frame_allocator.rs
          rustc --edition=2024 --test kernel/src/memory/frame_allocator.rs -o "$RUNNER_TEMP/vibrix-frame-tests"
          "$RUNNER_TEMP/vibrix-frame-tests"
      - name: Test native PCI enumeration and BAR parsing on host
        run: |
          rustfmt --edition 2024 --check kernel/src/arch/x86_64/pci.rs
          rustc --edition=2024 --test kernel/src/arch/x86_64/pci.rs -o "$RUNNER_TEMP/vibrix-pci-tests"
          "$RUNNER_TEMP/vibrix-pci-tests"
      - name: Test production early kernel heap on host
        run: |
          rustfmt --edition 2024 --check kernel/src/memory/heap.rs
          rustc --edition=2024 --test kernel/src/memory/heap.rs -o "$RUNNER_TEMP/vibrix-heap-tests"
          "$RUNNER_TEMP/vibrix-heap-tests"
      - name: Test structured kernel logging on host
        run: |
          rustfmt --edition 2024 --check kernel/src/klog.rs
          rustc --edition=2024 -D warnings --test kernel/src/klog.rs -o "$RUNNER_TEMP/vibrix-klog-tests"
          "$RUNNER_TEMP/vibrix-klog-tests"
      - name: Test production virtual mapping window on host
        run: |
          rustfmt --edition 2024 --check shared/vm_window.rs kernel/src/memory/virtual_memory.rs
          rustc --edition=2024 --test kernel/src/memory/virtual_memory.rs -o "$RUNNER_TEMP/vibrix-vm-tests"
          "$RUNNER_TEMP/vibrix-vm-tests"
      - name: Test CPUID discovery on host
        run: |
          rustc --edition=2024 --test kernel/src/arch/x86_64/cpuid.rs -o "$RUNNER_TEMP/vibrix-cpuid-tests"
          "$RUNNER_TEMP/vibrix-cpuid-tests"
      - name: Test production-linked GDT/TSS on host
        run: |
          rustfmt --check host-tests/gdt_layout.rs host-tests/gdt_tss.rs
          rustc --edition=2024 --test host-tests/gdt_layout.rs -o "$RUNNER_TEMP/vibrix-gdt-layout-tests"
          "$RUNNER_TEMP/vibrix-gdt-layout-tests"
          rustc --edition=2024 --test host-tests/gdt_tss.rs -o "$RUNNER_TEMP/vibrix-gdt-tss-tests"
          "$RUNNER_TEMP/vibrix-gdt-tss-tests"
      - name: Test production-linked SYSCALL/SYSRETQ policy on host
        run: |
          rustfmt --edition 2024 --check kernel/src/arch/x86_64/syscall.rs host-tests/syscall_transport.rs
          rustc --edition=2024 -D warnings --test host-tests/syscall_transport.rs -o "$RUNNER_TEMP/vibrix-syscall-transport-tests"
          "$RUNNER_TEMP/vibrix-syscall-transport-tests"
      - name: Test APIC IRQ routing policy on host
        run: |
          rustfmt --edition 2024 --check kernel/src/arch/x86_64/irq.rs
          rustc --edition=2024 -D warnings --test kernel/src/arch/x86_64/irq.rs -o "$RUNNER_TEMP/vibrix-irq-tests"
          "$RUNNER_TEMP/vibrix-irq-tests"
      - name: Test bounded kernel console line editor and commands on host
        run: |
          rustfmt --edition 2024 --check kernel/src/console.rs
          rustc --edition=2024 -D warnings --test kernel/src/console.rs -o "$RUNNER_TEMP/vibrix-console-tests"
          "$RUNNER_TEMP/vibrix-console-tests"
      - name: Test production serial console logic on host
        run: |
          rustc --edition=2024 --test kernel/src/arch/x86_64/serial.rs -o "$RUNNER_TEMP/vibrix-serial-tests"
          "$RUNNER_TEMP/vibrix-serial-tests"
      - name: Test native QEMU PS2 scan-code decoder on host
        run: |
          rustfmt --edition 2024 --check kernel/src/arch/x86_64/ps2.rs
          rustc --edition=2024 --test kernel/src/arch/x86_64/ps2.rs -o "$RUNNER_TEMP/vibrix-ps2-tests"
          "$RUNNER_TEMP/vibrix-ps2-tests"
      - name: Test legacy self-contained host fixtures (not production-linked)
        run: |
          set -euo pipefail
          for fixture in host-tests/*.rs; do
            case "$fixture" in
              host-tests/gdt_layout.rs|host-tests/gdt_tss.rs|host-tests/syscall_transport.rs|host-tests/loader_cleanup.rs|host-tests/transition.rs) continue ;;
            esac
            echo "[vibrix] fixture: $fixture"
            rustc --edition=2024 "$fixture" -o "$RUNNER_TEMP/vibrix-host-fixture"
            "$RUNNER_TEMP/vibrix-host-fixture"
          done
      - name: Test device and driver candidate model on host
        run: |
          rustfmt --edition 2024 --check kernel/src/device.rs
          rustc --edition=2024 -D warnings --test kernel/src/device.rs -o "$RUNNER_TEMP/vibrix-device-tests"
          "$RUNNER_TEMP/vibrix-device-tests"
      - name: Test production IDT layout and page-fault bit decoding on host
        run: |
          rustfmt --edition 2024 --check shared/idt_layout.rs kernel/src/arch/x86_64/idt.rs
          rustc --edition=2024 --test shared/idt_layout.rs -o "$RUNNER_TEMP/vibrix-idt-layout-tests"
          "$RUNNER_TEMP/vibrix-idt-layout-tests"
      - name: Build fixed-layout Rust init ELF for kernel probe compilation
        run: |
          cargo rustc --locked -p vibrix-init --bin vibrix-init --target x86_64-unknown-none -- \
            -C relocation-model=static \
            -C link-arg=-no-pie \
            -C link-arg=-Tuserspace/linker.ld
          test -s target/x86_64-unknown-none/debug/vibrix-init
      - name: Lint kernel
        run: cargo clippy --locked -p vibrix-kernel --all-features --target x86_64-unknown-none -- -D warnings
      - name: Build Vibrix
        run: bash tools/build-qemu.sh
      - name: QEMU boot from populated GPT EFI System Partition
        run: |
          image="$RUNNER_TEMP/vibrix-bootable-esp.img"
          "$RUNNER_TEMP/vibrix-create-usb-image" "$image" 64 512
          "$RUNNER_TEMP/vibrix-populate-esp" \
            "$image" \
            target/x86_64-unknown-uefi/debug/vibrix-boot.efi \
            target/x86_64-unknown-none/debug/vibrix-kernel \
            512
          "$RUNNER_TEMP/vibrix-inspect-esp" "$image" 512
          "$RUNNER_TEMP/vibrix-inspect-gpt" "$image" 512 >/dev/null
          before="$(sha256sum "$image" | cut -d ' ' -f 1)"
          source tools/ovmf.inc
          vibrix_find_ovmf
          cp -- "$OVMF_VARS" build/qemu/OVMF_VARS.esp.fd
          rm -f build/qemu/esp-debugcon.log build/qemu/esp-serial.log
          set +e
          timeout 12s qemu-system-x86_64 \
            -machine q35 \
            -accel tcg \
            -cpu max \
            -m 512M \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
            -drive "if=pflash,format=raw,file=build/qemu/OVMF_VARS.esp.fd" \
            -drive "if=none,id=vibrixesp,format=raw,readonly=on,file=$image" \
            -device "qemu-xhci,id=vibrix-boot-xhci" \
            -device "usb-storage,drive=vibrixesp,bus=vibrix-boot-xhci.0,bootindex=1" \
            -display none \
            -serial file:build/qemu/esp-serial.log \
            -monitor none \
            -no-reboot \
            -chardev file,id=vibrixespdbg,path=build/qemu/esp-debugcon.log \
            -device isa-debugcon,iobase=0xe9,chardev=vibrixespdbg
          rc=$?
          set -e
          if [[ "$rc" -ne 124 ]]; then
            echo "ESP-image QEMU boot exited unexpectedly with status $rc" >&2
            [[ -f build/qemu/esp-debugcon.log ]] && cat build/qemu/esp-debugcon.log
            [[ -f build/qemu/esp-serial.log ]] && cat build/qemu/esp-serial.log
            exit 1
          fi
          after="$(sha256sum "$image" | cut -d ' ' -f 1)"
          test "$before" = "$after"
          grep -Fq "VIBRIX: bootloader entered" build/qemu/esp-debugcon.log
          grep -Fq "VIBRIX: kernel.elf found" build/qemu/esp-debugcon.log
          grep -Fq "VIBRIX: ExitBootServices succeeded" build/qemu/esp-debugcon.log
          grep -Fq "VIBRIX: kernel entry after ExitBootServices" build/qemu/esp-debugcon.log
          grep -Fq "Vibrix kernel started." build/qemu/esp-serial.log

      - name: QEMU smoke test with native timer IRQ delivery
        env:
          VIBRIX_SKIP_BUILD: "1"
          VIBRIX_EXPECT_TIMER_IRQ: "1"
        run: |
          bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel process lifecycle verified" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel structured log verified" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel structured log verified" build/qemu/serial.log
      - name: QEMU native PCI scan with virtual xHCI controller
        env:
          VIBRIX_SKIP_BUILD: "1"
          VIBRIX_QEMU_XHCI: "1"
        run: |
          bash tools/test-qemu.sh
          grep -Eq 'Vibrix PCI segment0: [1-9][0-9]* devices, [1-9][0-9]* assigned BARs, [1-9][0-9]* xHCI' build/qemu/serial.log
      - name: QEMU native xHCI reset and running initialization
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,xhci-init-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_QEMU_XHCI=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel xHCI reset and running" build/qemu/debugcon.log
          grep -Eq 'kernel xHCI: [0-9a-f]{2}:[0-9a-f]{2}\.[0-7] bar=0x[0-9a-f]+ version=0x[0-9a-f]+ slots=[1-9][0-9]* ports=[1-9][0-9]*' build/qemu/serial.log
          # Restore the ordinary development image before later tests that
          # intentionally reuse build/qemu with VIBRIX_SKIP_BUILD=1.
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
      - name: QEMU xHCI address device and read USB descriptor
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,usb-enum-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_QEMU_USB_ENUM_PROBE=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel USB device addressed and descriptor read" build/qemu/debugcon.log
          grep -Eq 'kernel USB device: port=[1-9][0-9]* slot=[1-9][0-9]* speed=[1-9][0-9]* vid=[0-9a-f]{4} pid=[0-9a-f]{4} class=[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2} mps0=[1-9][0-9]*' build/qemu/serial.log
          if grep -Eq 'vid=0000|pid=0000' build/qemu/serial.log; then
            echo "USB descriptor proof returned a zero VID/PID" >&2
            exit 1
          fi
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
      - name: QEMU USB2 hub descriptor and downstream port management
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,usb-hub-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_QEMU_USB_HUB_PROBE=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel USB hub downstream port reset and enabled" build/qemu/debugcon.log
          grep -Eq 'kernel USB hub: root_port=[1-9][0-9]* slot=[1-9][0-9]* ports=[1-9][0-9]* child_port=[1-9][0-9]* child_status=0x[0-9a-f]{4} pwr_good_units=[0-9]+' build/qemu/serial.log
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
      - name: Test production USB HID descriptors and boot reports
        run: |
          cargo test --locked -p vibrix-kernel --lib usb_hid::
      - name: QEMU USB HID keyboard interrupt input
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,usb-hid-keyboard-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_QEMU_USB_HID_KEYBOARD_PROBE=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel USB HID keyboard ready" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel USB HID keyboard input observed" build/qemu/debugcon.log
          grep -Fq "VIBRIX: USB keyboard interrupt press modifiers release verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Eq '^kernel USB HID keyboard: root_port=[1-9][0-9]* slot=[1-9][0-9]* interface=[0-9]+ endpoint=0x8[0-9a-f] mps=[1-9][0-9]* interval=[1-9][0-9]* modifiers=0x[0-9a-f]{2} usage=0x0b$'
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
      - name: QEMU USB HID mouse interrupt input
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,usb-hid-mouse-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_QEMU_USB_HID_MOUSE_PROBE=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel USB HID mouse ready" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel USB HID mouse motion observed" build/qemu/debugcon.log
          grep -Fq "VIBRIX: USB mouse interrupt motion buttons release verified" build/qemu/debugcon.log
          grep -Eq '^kernel USB HID mouse: root_port=[1-9][0-9]* slot=[1-9][0-9]* interface=[0-9]+ endpoint=0x8[0-9a-f] mps=[1-9][0-9]* interval=[1-9][0-9]* buttons=0x[0-9a-f]{2} x=-?[0-9]+ y=-?[0-9]+' build/qemu/serial.log
          if grep -Fq " x=0 y=0" build/qemu/serial.log; then
            echo "USB HID mouse proof observed no motion" >&2
            exit 1
          fi
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
      - name: QEMU real keyboard injection after ExitBootServices
        env:
          VIBRIX_SKIP_BUILD: "1"
          VIBRIX_QEMU_KEYBOARD_PROBE: "1"
        run: |
          bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel PS2 byte entered TTY" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel TTY line discipline verified" build/qemu/debugcon.log
      - name: QEMU edited help command through real keyboard
        env:
          VIBRIX_SKIP_BUILD: "1"
          VIBRIX_QEMU_CONSOLE_PROBE: "1"
        run: bash tools/test-qemu.sh
      - name: QEMU retained RAM files, devfs and pipe console commands
        run: |
          VIBRIX_SKIP_BUILD=1 VIBRIX_QEMU_FILES_PROBE=1 ./tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel RAM tmp and runtime state verified" build/qemu/debugcon.log
      - name: QEMU post-firmware kernel panic test
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,panic-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel panic" build/qemu/debugcon.log
          grep -Fq "kernel panic:" build/qemu/serial.log
      - name: QEMU native breakpoint trap test
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,breakpoint-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel breakpoint exception handled" build/qemu/debugcon.log
          grep -Fq "kernel #BP breakpoint rip=" build/qemu/serial.log
      - name: QEMU native page-fault diagnostic test
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,page-fault-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel page fault diagnostic" build/qemu/debugcon.log
          grep -Fq "kernel #PF cr2=0x10000000000" build/qemu/serial.log
          grep -Fq "present=false write=false user=false reserved=false exec=false" build/qemu/serial.log
      - name: QEMU real CPL3 entry and TSS RSP0 trap proof
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,ring3-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel CPL3 mappings ready" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel CPL3 trap reached via TSS RSP0" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel ring3 probe: cs=0x23 ss=0x1b "
      - name: QEMU independent userspace CR3 and CPL3 trap proof
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,address-space-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel userspace CR3 prepared" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel userspace CR3 activated" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel userspace CR3 preserved across CPL3 trap" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel address space probe: kernel_cr3="
          tr -d '\r' < build/qemu/serial.log | grep -Fq " rip=0x400000 rsp=0x800000"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel address space trap: expected_cr3="
      - name: QEMU userspace stack lower-guard fault proof
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,user-stack-guard-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel userspace stack guard write armed" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel page fault diagnostic" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel #PF cr2=0x7fefff"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "present=false write=true user=true reserved=false exec=false"
      - name: QEMU validated ELF load into private userspace CR3
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,elf-load-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel userspace ELF loaded" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel userspace CR3 activated" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel userspace CR3 preserved across CPL3 trap" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel ELF probe: kernel_cr3="
          tr -d '\r' < build/qemu/serial.log | grep -Fq " entry=0x400000 rsp=0x800000"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel address space trap: expected_cr3="
      - name: QEMU real SYSCALL and SYSRETQ round trip
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,syscall-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel SYSCALL MSRs configured" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel SYSCALL entry reached" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel SYSCALL/SYSRETQ round trip verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel syscall probe: number=0xffffffffffffffff"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel ring3 probe: cs=0x23 ss=0x1b "
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel syscall round trip: observed=true"

      - name: QEMU process getpid wait copyout reap and exit syscalls
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,process-syscall-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel process getpid syscall verified" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel process wait copyout and reap verified" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel process exit syscall verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: getpid=1"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: wait pid=2 status=23 copied=true"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=42"

      - name: QEMU compiled Rust init executes as PID 1
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,rust-init-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel Rust init ELF loaded" build/qemu/debugcon.log
          grep -Fq "VIBRIX: Rust init userspace syscall reached" build/qemu/debugcon.log
          grep -Fq "VIBRIX: Rust init PID 1 exited through syscall" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel Rust init: kernel_cr3="
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: getpid=1"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=0"

      - name: QEMU package metadata and dependency database in Ring 3
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,package-metadata-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel package metadata ELF loaded" build/qemu/debugcon.log
          grep -Fq "VIBRIX: package metadata userspace syscall reached" build/qemu/debugcon.log
          grep -Fq "VIBRIX: package metadata userspace verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel package metadata: kernel_cr3="
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: getpid=1"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=0"

      - name: QEMU compiled Rust shell uses real syscalls VFS TTY and keyboard
        env:
          VIBRIX_KERNEL_FEATURES: qemu-debugcon,rust-shell-probe
          VIBRIX_SKIP_BUILD: "1"
          VIBRIX_EXPECT_TIMER_IRQ: "1"
          VIBRIX_QEMU_USER_SHELL_PROBE: "1"
        run: |
          VIBRIX_KERNEL_FEATURES="$VIBRIX_KERNEL_FEATURES" bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 VIBRIX_QEMU_USER_SHELL_PROBE=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel Rust shell ELF loaded" build/qemu/debugcon.log
          grep -Fq "VIBRIX: userspace TTY read waiting for keyboard" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "Vibrix shell"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "Vibrix commands - help COMMAND, man COMMAND, man shell"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "hi"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=0"

      - name: QEMU Rust shell executes every M6 core utility backend
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,core-utils-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 VIBRIX_QEMU_CORE_UTILS_PROBE=1 bash tools/test-qemu.sh
          tr -d '\r' < build/qemu/serial.log | grep -Fq "Vibrix bootstrap filesystem: files live in RAM until reboot."
          tr -d '\r' < build/qemu/serial.log | grep -Fq "/tmp/u"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "moved"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "2 1 running"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "2 1 zombie"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "utilities-ok"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=0"
          # Exactly the four deliberate self-copy/move and invalid-parent
          # operations fail. Source data must survive all four rejections.
          test "$(tr -d '\r' < build/qemu/serial.log | grep -Fc 'sh: command failed')" -eq 4
          test "$(tr -d '\r' < build/qemu/serial.log | grep -Fc 'Vibrix bootstrap filesystem: files live in RAM until reboot.')" -eq 3
          VIBRIX_KERNEL_FEATURES=qemu-debugcon bash tools/build-qemu.sh
      - name: QEMU supervisor write-protection fault
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,vm-write-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "kernel #PF cr2=0xffffc00000000000" build/qemu/serial.log
          grep -Fq "present=true write=true user=false reserved=false exec=false" build/qemu/serial.log
      - name: QEMU access after unmap fault
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,vm-unmap-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "kernel #PF cr2=0xffffc00000000000" build/qemu/serial.log
          grep -Fq "present=false write=false user=false reserved=false exec=false" build/qemu/serial.log
      - name: Preserve most recent QEMU diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qemu/*.log
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: CI gate
    if: always()
    needs: [repository-quality, supply-chain, dependency-review, minimal-features, build-and-smoke-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to succeed
        env:
          CHECKS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          checks = json.loads(os.environ["CHECKS"])
          failed = []
          for name, check in checks.items():
              allowed = {"success"}
              if name == "dependency-review" and os.environ["EVENT"] != "pull_request":
                  allowed = {"skipped"}
              if check["result"] not in allowed:
                  failed.append(f'{name}: {check["result"]}')
          if failed:
              print("Required checks did not pass:\n" + "\n".join(failed))
              sys.exit(1)
          print("All applicable CI checks passed.")
          PY
