name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy-boot:
    name: Clippy (boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Add UEFI target
        run: rustup target add x86_64-unknown-uefi

      - name: Run clippy (boot)
        run: cargo clippy -p vibrix-boot --target x86_64-unknown-uefi -- -D warnings

  clippy-kernel:
    name: Clippy (kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src

      - name: Run clippy (kernel)
        run: cargo clippy -p vibrix-kernel --target kernel/x86_64-vibrix.json -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Add UEFI target
        run: rustup target add x86_64-unknown-uefi

      - name: Build UEFI loader
        run: cargo build -p vibrix-boot --target x86_64-unknown-uefi

      - name: Build kernel
        run: cargo -Z build-std=core,compiler_builtins -Z build-std-features=compiler-builtins-mem rustc -p vibrix-kernel --target kernel/x86_64-vibrix.json -- -C link-arg=-Tkernel/linker.ld
