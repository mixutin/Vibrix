name: Update interruption evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  interruption-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --target x86_64-unknown-none
      - name: Exercise every staging crash cut
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib update_staging::
          cargo clippy --locked -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
          grep -Fq 'crash_cut_matrix_never_exposes_an_incomplete_generation' kernel/src/update_staging.rs
          grep -Fq 'interruption_recovery_advances_transaction_ids_without_reuse' kernel/src/update_staging.rs
