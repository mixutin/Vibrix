name: Named package profiles evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  named-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --target x86_64-unknown-none
      - name: Validate profile definitions
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-package named_profiles_are_bounded_unique_and_valid
          cargo test --locked -p vibrix-package security_lab_profile_is_explicit_and_safe_by_default
          cargo test --locked -p vibrix-package profile_installation_and_removal_are_transactional
          cargo clippy --locked -p vibrix-package --target x86_64-unknown-none -- -D warnings
