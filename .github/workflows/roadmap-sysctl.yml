name: Sysctl query evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sysctl-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - name: Test sysctl command semantics and native target
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-shell --lib
          cargo clippy --locked -p vibrix-shell --target x86_64-unknown-none -- -D warnings
          cargo clippy --locked -p vibrix-shell --lib --tests -- -D warnings
          grep -Fq 'Sysctl, b"sysctl"' userspace/shell/src/manual.rs
          grep -Fq 'success("sysctl kern.processes"' tools/userspace_cli_cases.py
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Exercise live sysctl queries in native Ring 3
        run: python3 tools/test_desktop_display.py
