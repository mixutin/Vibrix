name: TCP listen and RTO evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-none
      - name: Test TCP passive-open and retransmission policy
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib tcp::
          cargo clippy --locked -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
