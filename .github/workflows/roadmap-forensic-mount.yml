name: Read-only forensic mount evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  forensic-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-none,x86_64-unknown-uefi
      - name: Validate forensic mount policy
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib vfs::tests::read_only_mount_blocks_every_mutation_before_backend_entry
          cargo test --locked -p vibrix-kernel --lib vfs::tests::guest_behavior_proof_runs_on_production_code
          cargo clippy --locked -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Prove production policy after firmware exit
        run: |
          bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel read-only forensic mount verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "VIBRIX: kernel read-only forensic mount verified"
