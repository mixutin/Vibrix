name: Package profile transaction evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  package-profile-transactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-none,x86_64-unknown-uefi
      - name: Prove profile transactions fail atomically
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-package --lib profile_
          cargo clippy --locked -p vibrix-package --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Prove transactional profiles inside native Ring 3
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,package-metadata-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel package metadata ELF loaded" build/qemu/debugcon.log
          grep -Fq "VIBRIX: package metadata userspace verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=0"
