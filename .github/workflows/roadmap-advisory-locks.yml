name: Advisory file lock evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  advisory-lock-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-none,x86_64-unknown-uefi
      - name: Test advisory lock core
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib vfs::files::advisory_lock_tests
          cargo clippy --locked -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Prove advisory locks through the native Ring-3 syscall path
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,advisory-lock-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: advisory lock userspace I/O initialized" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "Vibrix advisory lock probe passed"
          tr -d '\r' < build/qemu/serial.log | grep -Fq "kernel process syscall: exit pid=1 status=0"
