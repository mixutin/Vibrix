name: Block abstraction evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Production block interface tests
        run: |
          rustfmt --edition 2024 --check kernel/src/block.rs kernel/src/lib.rs
          rustc --edition=2024 -D warnings --test kernel/src/block.rs -o "$RUNNER_TEMP/block-tests"
          "$RUNNER_TEMP/block-tests"
          cargo clippy -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Exercise production block interface after ExitBootServices
        run: |
          ./tools/test-qemu.sh
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel block abstraction verified'
          tr -d '\r' < build/qemu/serial.log | grep -Fx 'VIBRIX: kernel block abstraction verified'
