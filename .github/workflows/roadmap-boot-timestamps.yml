name: Boot ID and timestamp evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  boot-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-none,x86_64-unknown-uefi
      - name: Test clock and structured record contracts
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib boot_clock::
          cargo test --locked -p vibrix-kernel --lib klog::
          cargo clippy --locked -p vibrix-kernel --all-features --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Prove random boot ID RTC anchor and monotonic PIT timestamp
        run: |
          bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: kernel boot identity and wall clock initialized" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel timestamped structured log verified" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Eq 'kernel boot metadata: id=[0-9a-f]{32} wall=[1-9][0-9]+'
          tr -d '\r' < build/qemu/serial.log | grep -Eq 'kernel timestamped log: seq=[0-9]+ tick=[1-9][0-9]* wall=[1-9][0-9]+'
