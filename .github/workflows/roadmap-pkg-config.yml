name: pkg-config compatibility evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pkg-config-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --target x86_64-unknown-none
      - name: Check bounded parser and target library
        run: |
          rustfmt --edition 2024 --check userspace/pkgconfig/src/lib.rs
          rustc --edition 2024 --test userspace/pkgconfig/src/lib.rs -o /tmp/vibrix-pkgconfig-tests
          /tmp/vibrix-pkgconfig-tests
          rustc --edition 2024 --crate-name vibrix_pkgconfig --crate-type lib --target x86_64-unknown-none userspace/pkgconfig/src/lib.rs -o /tmp/libvibrix_pkgconfig.rlib
