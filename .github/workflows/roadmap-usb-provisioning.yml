name: Safe USB provisioning evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  provisioner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate provisioner
        run: |
          python3 -m py_compile tools/provision-usb.py tools/test-provision-usb.py
          python3 tools/test-provision-usb.py
          if python3 tools/provision-usb.py /dev/null /dev/null --dry-run; then
            echo "unsafe generic target was accepted"
            exit 1
          fi
