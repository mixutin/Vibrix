name: NIC abstraction evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  nic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Production NIC interface tests
        run: |
          rustfmt --edition 2024 --check \
            kernel/src/nic.rs \
            kernel/src/internet_checksum.rs \
            kernel/src/ethernet.rs \
            kernel/src/arp.rs \
            kernel/src/arp_runtime.rs \
            kernel/src/ipv4.rs \
            kernel/src/icmp.rs \
            kernel/src/udp.rs \
            kernel/src/dhcp.rs \
            kernel/src/lib.rs
          rustc --edition=2024 -D warnings --test kernel/src/nic.rs -o "$RUNNER_TEMP/nic-tests"
          "$RUNNER_TEMP/nic-tests"
          cargo clippy -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Exercise production NIC interface after ExitBootServices
        run: |
          ./tools/test-qemu.sh
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel NIC abstraction verified'
          tr -d '\r' < build/qemu/serial.log | grep -Fx 'VIBRIX: kernel NIC abstraction verified'
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel IPv4 ICMP echo verified'
          tr -d '\r' < build/qemu/serial.log | grep -Fx 'VIBRIX: kernel IPv4 ICMP echo verified'
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel UDP datagram verified'
          tr -d '\r' < build/qemu/serial.log | grep -Fx 'VIBRIX: kernel UDP datagram verified'
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel Ethernet ARP responder verified'
          tr -d '\r' < build/qemu/serial.log | grep -Fx 'VIBRIX: kernel Ethernet ARP responder verified'
          tr -d '\r' < build/qemu/debugcon.log | grep -Fx 'VIBRIX: kernel DHCPv4 client exchange verified'
          tr -d '\r' < build/qemu/serial.log | grep -Fx 'VIBRIX: kernel DHCPv4 client exchange verified'
