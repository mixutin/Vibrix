name: Website validation and Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_site.py'
      - 'tools/test_build_site.py'
      - 'tools/check_site.py'
      - 'tools/test_check_site.py'
      - 'tools/test-site.cjs'
      - '.github/workflows/pages.yml'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test offline website validator and multipage builder
        run: |
          python3 -m unittest discover -s tools -p 'test_check_site.py' -v
          python3 -m unittest discover -s tools -p 'test_build_site.py' -v
      - name: Build static multipage website
        run: python3 tools/build_site.py
      - name: Check generated links, fragments, structured data and metadata
        run: python3 tools/check_site.py build/site
      - name: Check and test browser-data helpers
        run: |
          node --check site/script.js
          node --test tools/test-site.cjs
      - name: Preserve the validated website for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified website
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the same static website from the checked revision
        run: |
          python3 tools/build_site.py
          python3 tools/check_site.py build/site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
