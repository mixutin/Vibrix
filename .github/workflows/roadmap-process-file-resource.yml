name: Process file resource admission evidence

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  file-resource-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src,rustfmt,clippy --target x86_64-unknown-uefi,x86_64-unknown-none
      - name: Check process resource and syscall integration
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p vibrix-kernel --lib process::
          cargo clippy --locked -p vibrix-kernel --lib --target x86_64-unknown-none -- -D warnings
          cargo clippy --locked -p vibrix-kernel --bin vibrix-kernel --target x86_64-unknown-none --features qemu-debugcon,rust-shell-probe -- -D warnings
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Exercise real Ring-3 open and close paths
        run: |
          VIBRIX_KERNEL_FEATURES=qemu-debugcon,rust-shell-probe bash tools/build-qemu.sh
          VIBRIX_SKIP_BUILD=1 VIBRIX_EXPECT_TIMER_IRQ=1 VIBRIX_QEMU_USER_SHELL_PROBE=1 bash tools/test-qemu.sh
          grep -Fq "VIBRIX: process file resource accounting active" build/qemu/debugcon.log
          grep -Fq "VIBRIX: kernel Rust shell ELF loaded" build/qemu/debugcon.log
          tr -d '\r' < build/qemu/serial.log | grep -Fq "hi"
