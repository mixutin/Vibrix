[workspace]
resolver = "3"
members = ["boot", "kernel", "shared/vmm", "userspace/syscall", "userspace/init", "userspace/shell"]

[workspace.package]
license = "0BSD"
repository = "https://github.com/mixutin/Vibrix"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
